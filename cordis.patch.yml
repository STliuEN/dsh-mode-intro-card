# dsh-mode-intro-card bundle patch: add the package-local preset tree to the
# roster and insert the dual-face UI plugin row. The preset root exists only
# while this bundle layer is active; no files are copied into DSH_HOME.
- id: agent-presets
  config:
    default: standard
    roots:
      - path: !!js >-
          process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-mode-intro-card/package.json')), 'presets')
        trust: system

- insert:
    - id: mode-intro-card
      name: 'dsh-mode-intro-card'
